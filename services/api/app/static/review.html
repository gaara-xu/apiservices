<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>图片喜好 · 学习与复核</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101318;color:#eef1f5}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid #252a33}h1{font-size:17px;margin:0;font-weight:600}#counts{font-size:13px;color:#9aa5b4}main{width:min(1100px,100%);margin:auto;flex:1;display:flex;flex-direction:column;padding:16px 20px 24px;gap:12px}.stage{position:relative;flex:1;min-height:250px;height:calc(100dvh - 205px);display:flex;align-items:center;justify-content:center;background:#0b0d11;border-radius:12px;overflow:hidden}img{max-width:100%;max-height:calc(100dvh - 205px);object-fit:contain;display:block}img[hidden]{display:none}#placeholder{color:#aab5c5;text-align:center;padding:28px;line-height:1.7}#name{text-align:center;font-size:12px;color:#98a3b1;overflow-wrap:anywhere;min-height:16px}#message{min-height:20px;font-size:14px;text-align:center;color:#c4d0df;margin:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(500px,100%);margin:0 auto}button{font:inherit;font-weight:600;border:1px solid #444e60;border-radius:10px;min-height:54px;cursor:pointer;background:#272e39;color:#eef1f5}button.like{background:#20654e;border-color:#2a8869}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #9abaff;outline-offset:3px}button:active:not(:disabled){transform:translateY(1px)}@media(max-width:600px){header{padding:15px;flex-direction:column;gap:7px}main{padding:10px 12px 20px}.stage{height:calc(100dvh - 240px)}img{max-height:calc(100dvh - 240px)}}
.panel{padding:14px;border:1px solid #303948;border-radius:12px;background:#171d26}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{font-size:13px;min-height:38px;padding:8px 14px}.controls button.active{background:#305573;border-color:#6c9bc0}.progressrow{display:flex;justify-content:space-between;gap:12px;margin:12px 0 8px;font-size:13px}progress{width:100%;height:12px;accent-color:#46aa84}#aiError{color:#edac96;font-size:13px;overflow-wrap:anywhere}.image-meta{display:flex;align-items:baseline;justify-content:center;gap:12px;min-width:0}#name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#reviewProgress{flex:none;white-space:nowrap}@media(max-width:600px){.image-meta{gap:6px}#reviewProgress{font-size:12px!important}}#fileSize{flex:none;font-size:12px;color:#98a3b1}#fileSize.large{background:#20654e;color:#eef1f5;border-radius:5px;padding:3px 7px}.stage{height:clamp(250px,54dvh,640px)}img{max-height:54dvh}.modebar{display:flex;gap:8px;flex-wrap:wrap}.modebar button{font-size:13px;min-height:38px;padding:6px 14px}.modebar button.active{background:#305573;border-color:#6c9bc0}@media(max-width:600px){header{padding:12px}.progressrow{flex-direction:column;gap:4px}.controls{display:grid;grid-template-columns:1fr 1fr}.stage{height:46dvh}img{max-height:46dvh}}
.actions{position:sticky;bottom:10px;padding:8px;background:#101318;border-radius:12px;z-index:2}.model-status{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px;font-size:14px}.status-light{width:11px;height:11px;border-radius:50%;background:#8792a2;flex:none}.status-light[data-state="ready"]{background:#4bd89b;box-shadow:0 0 8px #4bd89b66}.status-light[data-state="loading"],.status-light[data-state="unconfigured"]{background:#f4c05c}.status-light[data-state="offline"],.status-light[data-state="error"]{background:#f47979}#modelStatusText{color:#b9c8d8;overflow-wrap:anywhere}[hidden]{display:none!important}.viewer{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px}.filmstrip{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:6px;height:54dvh;min-height:250px}.thumb{min-height:0;overflow:hidden;padding:3px;position:relative;font-size:11px}.thumb img{width:100%;height:calc(100% - 18px);max-height:none;object-fit:contain}.thumb.selected{outline:2px solid #9abaff}.thumb.anchor{border-color:#46aa84}.thumb span{display:block;white-space:nowrap}.viewer .stage{min-width:0}.thumb:disabled{opacity:.6}@media(max-width:600px){.viewer{grid-template-columns:minmax(0,1fr) 72px;gap:6px}.filmstrip{height:46dvh}} </style></head><body><main><section class="panel" aria-label="AI任务控制"><div class="model-status" role="status" aria-live="polite"><span id="modelLight" class="status-light" data-state="unknown" aria-hidden="true"></span><strong>AI模型状态</strong><span id="modelStatusText">正在检测…</span></div><div class="controls"><button id="train" hidden>开始 AI 学习</button><button id="screen">开始 AI 筛选</button><button id="stopTrain" hidden disabled>停止学习</button><button id="stop" disabled>停止筛查</button><button id="cleanup">删除无用图片</button><button id="upload">上传图片</button><input id="uploadFiles" type="file" accept="image/*" multiple hidden><span id="uploadStatus" role="status"></span><button id="rescan">刷新目录</button></div><div id="taskSummary" class="progressrow" hidden><span id="aiProgress" role="status" aria-live="polite">正在读取任务状态…</span><span id="aiPhase"></span></div><div id="manualLearning" hidden><div id="learningProgressText" style="font-size:13px;margin:10px 0" role="status" aria-live="polite"></div><progress id="progress" value="0" max="1" aria-label="本次新增图片学习进度"></progress></div><div id="reviewLearning" style="font-size:13px;color:#aabed4;margin-top:8px"></div><div id="aiError"></div><details id="warningDetails" hidden><summary>待重试图片明细</summary><div id="warningList" style="font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px"></div></details></section><nav class="modebar" aria-label="图片来源"><button data-source="all" class="active">原始图片初选</button><button data-source="ai_like">AI 喜欢 · 复核</button><button data-source="ai_notlike">AI 不喜欢 · 复核</button></nav><div class="image-meta"><div id="reviewProgress" role="status" aria-live="polite" hidden style="font-size:14px;color:#bed1e8;text-align:center"></div><div id="name"></div><div id="fileSize" hidden></div></div><div class="viewer"><div class="stage"><div id="placeholder">正在刷新图片目录…</div><img id="photo" alt="待分类图片" hidden></div><aside id="filmstrip" class="filmstrip" aria-label="五张图片浏览"></aside></div><p id="message" role="status" aria-live="polite"></p><div class="actions"><button id="no" type="button" disabled>不喜欢</button><button id="yes" class="like" type="button" disabled>喜欢</button></div></main>
<script>
const base='/api/v1/image-preference';
const photo=document.querySelector('#photo'),placeholder=document.querySelector('#placeholder'),message=document.querySelector('#message'),yes=document.querySelector('#yes'),no=document.querySelector('#no');
let windowItems=[null,null,null,null,null],anchorId=null;
let current=null,busy=true,source='all',aiBusy=false,latestRun=null,manualLearningRunId=null;
// 切换交互状态，阻止连续点击导致多张图片被误移动。
function setBusy(value){busy=value;yes.disabled=no.disabled=value||!current||photo.hidden||['like','notlike'].includes(current.state);document.querySelectorAll('[data-source],#rescan').forEach(button=>button.disabled=value);}
// 调用接口并将服务端错误转换为可读提示。
async function api(path,options={}){const response=await fetch(base+path,{cache:'no-store',...options});const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'操作失败，请刷新页面重试');return data;}

// 重绘五个固定位置，点击缩略图仅切换大图，不重新取窗口。
function renderWindow(){const strip=document.querySelector('#filmstrip');strip.replaceChildren();windowItems.forEach((item,index)=>{const button=document.createElement('button');button.className='thumb';button.classList.toggle('anchor',index===2);button.classList.toggle('selected',!!item&&item.id===current?.id);button.disabled=!item;button.dataset.id=item?.id||'';button.setAttribute('aria-label',`${index+1}：${item?.name||'暂无图片'}`);button.setAttribute('aria-pressed',String(!!item&&item.id===current?.id));if(item){const img=document.createElement('img');img.src=item.preview_url;img.alt=item.name;button.append(img);}const label=document.createElement('span');label.textContent=(['前两张','前一张','当前','下一张','下两张'][index])+(item&&['like','notlike'].includes(item.state)?(item.state==='like'?' · 喜欢':' · 不喜欢'):'');button.append(label);button.addEventListener('click',()=>{if(!busy)showImage(item);});strip.append(button);});}
// 切换大图和同行元信息；已处理图片可回看，选择按钮仅对待处理图片启用。
function showImage(item){setBusy(true);current=item;photo.hidden=true;placeholder.hidden=false;placeholder.textContent=item?'正在读取图片…':'该来源暂无待处理图片。可回看右侧图片或切换来源。';const size=document.querySelector('#fileSize');size.hidden=!item;size.classList.toggle('large',!!item&&item.size_bytes>1000000);size.textContent=item?`原图大小 ${(item.size_bytes/1000000).toFixed(2)} MB`:'';document.querySelector('#name').textContent=item?.name||'';document.querySelector('#name').title=item?.name||'';document.querySelectorAll('.thumb').forEach(button=>{const selected=!!item&&button.dataset.id===item.id;button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected));});if(!item){setBusy(false);return;}photo.onload=()=>{placeholder.hidden=true;photo.hidden=false;setBusy(false);};photo.onerror=()=>{placeholder.textContent='图片无法预览，请刷新页面重试。';setBusy(false);};photo.src=item.preview_url;}
// 仅初始化、刷新来源或第三张确认后获取新窗口；空列表后台检查保持安静。
async function nextImage(silent=false){const requestedSource=source;if(!silent)setBusy(true);try{const data=await api('/next?source='+requestedSource);if(requestedSource!==source||(silent&&(busy||current)))return;if(silent&&!data.image)return;windowItems=data.window||[null,null,data.image,null,null];anchorId=windowItems[2]?.id||null;const progress=data.review_progress,counter=document.querySelector('#reviewProgress');counter.hidden=source==='all';counter.textContent=progress?`复核进度 ${progress.position}/${progress.total} · 已复核 ${progress.completed} 张`:'';renderWindow();showImage(windowItems[2]);}catch(error){setBusy(false);throw error;}}
// 确认所浏览图片，只有第三张完成才推进窗口，其他位置确认后保持五图不变。
async function decide(value){if(busy||!current||['like','notlike'].includes(current.state))return;setBusy(true);const id=current.id;try{const result=await api(`/images/${id}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:value})});windowItems=windowItems.map(item=>item?.id===id?result.image:item);current=result.image;message.textContent=(value==='like'?'已移入喜欢目录':'已移入不喜欢目录')+(source!=='all'?'，已提交本次复核增量学习':'');if(id===anchorId){await nextImage();}else{renderWindow();setBusy(false);}}catch(error){message.textContent=error.message;setBusy(false);}}
// 初始刷新目录并展示第一张待分类图片，不发起AI任务。
async function initialize(){setBusy(true);try{await api('/scan',{method:'POST'});await nextImage();}catch(error){placeholder.textContent=error.message;message.textContent='请确认目录可用后刷新页面。';}}
// 独立轮询模型状态，完整文字一次更新且相同内容不重绘，失败不保留旧绿灯。
async function pollModel(){const light=document.querySelector('#modelLight'),text=document.querySelector('#modelStatusText');try{const data=await api('/ai/model-status');light.dataset.state=data.state;const names={ready:'已就绪',loading:'模型加载中',offline:'Mac AI 离线',error:'模型异常',unconfigured:'尚未配置Mac AI'};const label=(names[data.state]||'状态未知')+(data.state==='ready'?` · ${(data.device||'未知设备').toUpperCase()} · 喜好模型${data.personal_preference_trained?'已训练':'未训练'}`:'');if(text.textContent!==label)text.textContent=label;text.title=data.detail||data.model||'';}catch(error){light.dataset.state='unknown';text.textContent='状态获取失败';text.title=error.message;}setTimeout(pollModel,5000);}
// 仅本页面手动开始学习后展示新增进度，复核学习、历史任务和筛选不复用此进度条。
function renderLearningProgress(r){const wrapper=document.querySelector('#manualLearning'),bar=document.querySelector('#progress'),text=document.querySelector('#learningProgressText');const manual=r&&r.kind==='train'&&r.id===manualLearningRunId;wrapper.hidden=!(manual&&['running','finalizing','stopping'].includes(r.state));if(wrapper.hidden)return;if(!r.plan_ready){text.textContent='正在核对新增图片…';bar.hidden=false;bar.removeAttribute('value');return;}const plan=r.input_plan||{},added=plan.new||{total:0,completed:0,failed:0},changed=plan.changed||{total:0,completed:0},reuse=plan.reuse||{total:0};text.textContent=`本次新增图片 ${added.completed}/${added.total}`+(added.failed?` · 待重试 ${added.failed}`:'')+(changed.total?` · 修改图片 ${changed.completed}/${changed.total}`:'')+` · 已有样本复用 ${reuse.total}`;if(!added.total)text.textContent='本次无新增图片'+(changed.total?` · 修改图片 ${changed.completed}/${changed.total}`:'')+'，正在应用最新标签';bar.hidden=!added.total;bar.max=Math.max(added.total,1);bar.value=added.completed;}
// 状态轮询只更新展示和按钮，不启动学习，也不把历史训练总数显示为新增进度。
async function refreshAI(){try{const data=await api('/ai/status');latestRun=data.run;const r=data.run,training=data.training||(r?.kind==='train'?r:null),screening=data.screening||(r?.kind==='screen'?r:null),queued=data.review_learning||{};const trainingActive=training&&['running','stopping','finalizing'].includes(training.state);const screeningActive=screening&&['running','stopping','paused_for_learning'].includes(screening.state);const running=r&&['running','stopping','finalizing','paused_for_learning'].includes(r.state);const active=running||queued.pending||queued.running;document.querySelector('#reviewLearning').textContent=queued.pending||queued.running?`后台复核学习：等待 ${queued.pending||0} 条 · 处理中 ${queued.running||0} 条（筛查独立运行）`:'';document.querySelector('#train').disabled=aiBusy||trainingActive;document.querySelector('#screen').disabled=aiBusy||screeningActive;document.querySelector('#stopTrain').disabled=aiBusy||!(trainingActive||queued.pending||queued.running)||training?.state==='stopping';document.querySelector('#stop').disabled=aiBusy||!screeningActive||screening?.state==='stopping';const states={running:'进行中',paused_for_learning:'复核模型更新后继续筛选',stopping:'正在停止',stopped:'已停止',finalizing:'正在更新个人分类器',completed:'已完成',failed:'需要处理',needs_samples:'需要有效的喜欢和不喜欢样本'};const manual=r&&r.id===manualLearningRunId;document.querySelector('#taskSummary').hidden=!active&&!manual;document.querySelector('#aiPhase').textContent=r?states[r.state]||r.state:'';document.querySelector('#aiProgress').textContent=!r?'':r.kind==='screen'?`当前筛选 ${r.processed+r.failed}/${r.total}`:manual?(r.state==='completed'?`本次新增图片学习完成 ${(r.input_plan?.new?.completed)||0} 张`:'手动学习'):running?'正在根据人工复核更新喜好模型':'';renderLearningProgress(training);const warnings=r?.warnings||[];document.querySelector('#warningDetails').hidden=!warnings.length;document.querySelector('#warningList').textContent=warnings.map(item=>`${item.name||item.image_id}：${item.error}`).join('\n');document.querySelector('#aiError').textContent=r&&r.error?r.error:r&&r.kind==='screen'&&r.state==='running'&&r.processed+r.failed===r.total?'当前队列已处理完，持续等待新图片。':'';}catch(error){document.querySelector('#aiError').textContent='状态读取失败：'+error.message;}}
// 仅手动点击学习才关联本轮新增进度，刷新页面不会恢复旧进度条。
async function startAI(kind){if(aiBusy)return;aiBusy=true;document.querySelector('#train').disabled=document.querySelector('#screen').disabled=true;if(kind==='train'){document.querySelector('#manualLearning').hidden=false;document.querySelector('#learningProgressText').textContent='正在检查当前目录…';const bar=document.querySelector('#progress');bar.hidden=false;bar.removeAttribute('value');}try{const result=await api('/ai/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind})});if(kind==='train')manualLearningRunId=result.id;message.textContent=kind==='train'?'开始检查新增图片，已有特征将复用':'筛选已启动，结果进入AI待复核目录';}catch(error){document.querySelector('#manualLearning').hidden=true;message.textContent=error.message;}finally{aiBusy=false;await refreshAI();}}
// 分别停止学习或筛查，停止学习不会中断筛查，当前图片可完成。
async function stopAI(kind){try{await api('/ai/stop?kind='+kind,{method:'POST'});await refreshAI();}catch(error){message.textContent=error.message;}}
// 切换初选和两类AI复核来源，等待当前选择完成后再换图。
async function changeSource(value){if(busy&&current)return;source=value;document.querySelectorAll('[data-source]').forEach(button=>button.classList.toggle('active',button.dataset.source===value));try{await nextImage();}catch(error){message.textContent=error.message;}}
// 手工刷新目录和当前图片，不自动启动学习或筛选。
async function rescan(){if(busy&&current)return;try{await api('/scan',{method:'POST'});await nextImage();}catch(error){message.textContent=error.message;}}
// 串行轮询任务；空来源静默检查新图片，不反复显示加载提示或禁用按钮。
async function poll(){await refreshAI();await refreshLearningMode();try{if(!current&&!busy)await nextImage(true);}catch(error){document.querySelector('#aiError').textContent=error.message;}setTimeout(poll,2000);}
// 依据数据库训练记录显示全新环境的学习入口，后台复核更新始终保留。
async function refreshLearningMode(){try{const mode=await api('/learning-mode');document.querySelector('#train').hidden=!mode.show_learning;document.querySelector('#stopTrain').hidden=!mode.show_learning;}catch(error){message.textContent=error.message;}}
// 用户确认后清理已保留完整特征的不喜欢原图，完成后重新取可回看的窗口。
async function cleanupImages(){if(!confirm('删除已完成学习且特征已保留的不喜欢原图？每次最多20张，删除后不能回看，历史喜好会保留。'))return;const button=document.querySelector('#cleanup');button.disabled=true;try{const result=await api('/cleanup-notlike',{method:'POST'});message.textContent=`已删除 ${result.removed} 张原图；保留 ${result.skipped.length} 张未满足清理条件的图片`;message.title=result.skipped.map(item=>item.name+'：'+item.reason).join('\n');if(!busy)await nextImage();}catch(error){message.textContent=error.message;}finally{button.disabled=false;}}
document.querySelector('#cleanup').addEventListener('click',cleanupImages);refreshLearningMode();
// 顺序上传多张原图，单张失败继续其余图片，上传不触发学习或切换当前窗口。
async function uploadImages(){const input=document.querySelector('#uploadFiles'),files=Array.from(input.files),button=document.querySelector('#upload'),status=document.querySelector('#uploadStatus');if(!files.length)return;button.disabled=true;let success=0;const failed=[];try{for(let i=0;i<files.length;i++){status.textContent=`上传 ${i+1}/${files.length}`;try{await api('/upload?filename='+encodeURIComponent(files[i].name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:files[i]});success++;}catch(error){failed.push(files[i].name+'：'+error.message);}}status.textContent=`已上传 ${success}/${files.length} 张到 allImages`+(failed.length?`，失败 ${failed.length} 张`:'');status.title=failed.join('\n');if(!current&&!busy)await nextImage(true);}finally{button.disabled=false;input.value='';}}
document.querySelector('#upload').addEventListener('click',()=>document.querySelector('#uploadFiles').click());document.querySelector('#uploadFiles').addEventListener('change',uploadImages);
document.querySelector('#train').addEventListener('click',()=>startAI('train'));document.querySelector('#screen').addEventListener('click',()=>startAI('screen'));document.querySelector('#stop').addEventListener('click',()=>stopAI('screen'));document.querySelector('#stopTrain').addEventListener('click',()=>stopAI('train'));document.querySelector('#rescan').addEventListener('click',rescan);document.querySelectorAll('[data-source]').forEach(button=>button.addEventListener('click',()=>changeSource(button.dataset.source)));poll();pollModel();
yes.addEventListener('click' ,()=>decide('like'));no.addEventListener('click',()=>decide('notlike'));initialize();
</script></body></html>
