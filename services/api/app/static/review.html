<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>图片喜好 · 学习与复核</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101318;color:#eef1f5}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid #252a33}h1{font-size:17px;margin:0;font-weight:600}#counts{font-size:13px;color:#9aa5b4}main{width:min(1100px,100%);margin:auto;flex:1;display:flex;flex-direction:column;padding:16px 20px 24px;gap:12px}.stage{position:relative;flex:1;min-height:250px;height:calc(100dvh - 205px);display:flex;align-items:center;justify-content:center;background:#0b0d11;border-radius:12px;overflow:hidden}img{max-width:100%;max-height:calc(100dvh - 205px);object-fit:contain;display:block}img[hidden]{display:none}#placeholder{color:#aab5c5;text-align:center;padding:28px;line-height:1.7}#name{text-align:center;font-size:12px;color:#98a3b1;overflow-wrap:anywhere;min-height:16px}#message{min-height:20px;font-size:14px;text-align:center;color:#c4d0df;margin:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(500px,100%);margin:0 auto}button{font:inherit;font-weight:600;border:1px solid #444e60;border-radius:10px;min-height:54px;cursor:pointer;background:#272e39;color:#eef1f5}button.like{background:#20654e;border-color:#2a8869}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #9abaff;outline-offset:3px}button:active:not(:disabled){transform:translateY(1px)}@media(max-width:600px){header{padding:15px;flex-direction:column;gap:7px}main{padding:10px 12px 20px}.stage{height:calc(100dvh - 240px)}img{max-height:calc(100dvh - 240px)}}
.panel{padding:14px;border:1px solid #303948;border-radius:12px;background:#171d26}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{font-size:13px;min-height:38px;padding:8px 14px}.controls button.active{background:#305573;border-color:#6c9bc0}.progressrow{display:flex;justify-content:space-between;gap:12px;margin:12px 0 8px;font-size:13px}progress{width:100%;height:12px;accent-color:#46aa84}#aiError{color:#edac96;font-size:13px;overflow-wrap:anywhere}#modelInfo{color:#99a9bc;font-size:12px;margin:8px 0 0}.stage{height:clamp(250px,54dvh,640px)}img{max-height:54dvh}.modebar{display:flex;gap:8px;flex-wrap:wrap}.modebar button{font-size:13px;min-height:38px;padding:6px 14px}.modebar button.active{background:#305573;border-color:#6c9bc0}@media(max-width:600px){header{padding:12px}.progressrow{flex-direction:column;gap:4px}.controls{display:grid;grid-template-columns:1fr 1fr}.stage{height:46dvh}img{max-height:46dvh}}
.actions{position:sticky;bottom:10px;padding:8px;background:#101318;border-radius:12px;z-index:2}.model-status{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px;font-size:14px}.status-light{width:11px;height:11px;border-radius:50%;background:#8792a2;flex:none}.status-light[data-state="ready"]{background:#4bd89b;box-shadow:0 0 8px #4bd89b66}.status-light[data-state="loading"],.status-light[data-state="unconfigured"]{background:#f4c05c}.status-light[data-state="offline"],.status-light[data-state="error"]{background:#f47979}#modelStatusText{color:#b9c8d8;overflow-wrap:anywhere}[hidden]{display:none!important}</style></head><body><header><h1>图片喜好 <span style="font-size:12px;color:#91a0b2;font-weight:400">人工标注 / AI 学习 / 二次校验</span></h1><div id="counts">正在读取目录…</div></header><main><section class="panel" aria-label="AI任务控制"><div class="model-status" role="status" aria-live="polite"><span id="modelLight" class="status-light" data-state="unknown" aria-hidden="true"></span><strong>AI模型状态</strong><span id="modelStatusText">正在检测…</span></div><div class="controls"><button id="train">开始 AI 学习</button><button id="screen">开始 AI 筛选</button><button id="stopTrain" disabled>停止学习</button><button id="stop" disabled>停止筛查</button><button id="rescan">刷新目录</button></div><div id="taskSummary" class="progressrow" hidden><span id="aiProgress" role="status" aria-live="polite">正在读取任务状态…</span><span id="aiPhase"></span></div><div id="manualLearning" hidden><div id="learningProgressText" style="font-size:13px;margin:10px 0" role="status" aria-live="polite"></div><progress id="progress" value="0" max="1" aria-label="本次新增图片学习进度"></progress></div><div id="reviewLearning" style="font-size:13px;color:#aabed4;margin-top:8px"></div><div id="aiError"></div><details id="warningDetails" hidden><summary>待重试图片明细</summary><div id="warningList" style="font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px"></div></details><p id="modelInfo">喜欢样本：goodImages + likeImages；不喜欢样本：notlikeImages。仅手动开始学习或人工复核触发学习。未变图片复用特征，复核标签后台更新喜好参数，筛查继续使用当前参数。</p></section><nav class="modebar" aria-label="图片来源"><button data-source="all" class="active">原始图片初选</button><button data-source="ai_like">AI 喜欢 · 复核</button><button data-source="ai_notlike">AI 不喜欢 · 复核</button></nav><div id="reviewProgress" role="status" aria-live="polite" hidden style="font-size:14px;color:#bed1e8;text-align:center"></div><div class="stage"><div id="placeholder">正在刷新图片目录…</div><img id="photo" alt="待分类图片" hidden></div><div id="name"></div><div id="fileSize" style="font-size:12px;color:#98a3b1;text-align:center" hidden></div><p id="message" role="status" aria-live="polite"></p><div class="actions"><button id="no" type="button" disabled>不喜欢</button><button id="yes" class="like" type="button" disabled>喜欢</button></div></main>
<script>
const base='/api/v1/image-preference';
const photo=document.querySelector('#photo'),placeholder=document.querySelector('#placeholder'),message=document.querySelector('#message'),yes=document.querySelector('#yes'),no=document.querySelector('#no');
let current=null,busy=true,source='all',aiBusy=false,latestRun=null,manualLearningRunId=null;
// 切换交互状态，阻止连续点击导致多张图片被误移动。
function setBusy(value){busy=value;yes.disabled=no.disabled=value||!current||photo.hidden;document.querySelectorAll('[data-source],#rescan').forEach(button=>button.disabled=value);}
// 调用接口并将服务端错误转换为可读提示。
async function api(path,options={}){const response=await fetch(base+path,{cache:'no-store',...options});const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'操作失败，请刷新页面重试');return data;}
// 按当前目录展示全部人工样本，并明确喜欢包含预先确认和人工选择两部分。
async function refreshCounts(){const s=await api('/stats');const positive=s.good+s.like,total=positive+s.notlike;document.querySelector('#counts').textContent=`待选 ${s.pending} · 人工样本 ${total}（喜欢 ${positive} / 不喜欢 ${s.notlike}） · AI待复核 ${(s.ai_like||0)+(s.ai_notlike||0)}`;}

// 请求图片并显示持久复核进度与原图大小，实际加载完成前禁用选择。
async function nextImage(){setBusy(true);current=null;photo.hidden=true;placeholder.hidden=false;placeholder.textContent='正在读取图片…';const data=await api('/next?source='+source);current=data.image;const progress=data.review_progress;const counter=document.querySelector('#reviewProgress');counter.hidden=source==='all';counter.textContent=progress?`复核进度 ${progress.position}/${progress.total} · 已复核 ${progress.completed} 张`:'';const size=document.querySelector('#fileSize');size.hidden=!current;size.textContent=current?`原图大小 ${(current.size_bytes/1000000).toFixed(2)} MB`:'';document.querySelector('#name').textContent=current?current.name:'';if(!current){setBusy(false);placeholder.textContent='该来源暂无待处理图片。可切换来源或刷新目录。';return;}photo.onload=()=>{placeholder.hidden=true;photo.hidden=false;setBusy(false);};photo.onerror=()=>{placeholder.textContent='图片无法预览，请刷新页面重试。原文件未移动。';setBusy(false);};photo.src=current.preview_url;}
// 保存人工选择，移动成功后才切换下一张，失败时保留当前图片。
async function decide(value){if(busy||!current)return;setBusy(true);const id=current.id;try{await api(`/images/${id}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:value})});message.textContent=(value==='like'?'已移入喜欢目录':'已移入不喜欢目录')+(source!=='all'?'，已提交本次复核增量学习':'');await nextImage();await refreshCounts();}catch(error){message.textContent=error.message;setBusy(false);}}
// 初始刷新目录并展示第一张待分类图片，不发起AI任务。
async function initialize(){setBusy(true);try{await api('/scan',{method:'POST'});await refreshCounts();await nextImage();}catch(error){placeholder.textContent=error.message;message.textContent='请确认目录可用后刷新页面。';}}
// 独立轮询110探测结果，以灯色及文字同时展示模型状态，失败不保留旧绿灯。
async function pollModel(){const light=document.querySelector('#modelLight'),text=document.querySelector('#modelStatusText');try{const data=await api('/ai/model-status');light.dataset.state=data.state;const names={ready:'已就绪',loading:'模型加载中',offline:'Mac AI 离线',error:'模型异常',unconfigured:'尚未配置Mac AI'};text.textContent=names[data.state]||'状态未知';if(data.state==='ready'){text.textContent+=` · ${(data.device||'未知设备').toUpperCase()} · 喜好模型${data.personal_preference_trained?'已训练':'未训练'}`;}text.title=data.detail||data.model||'';}catch(error){light.dataset.state='unknown';text.textContent='状态获取失败';text.title=error.message;}setTimeout(pollModel,5000);}
// 仅本页面手动开始学习后展示新增进度，复核学习、历史任务和筛选不复用此进度条。
function renderLearningProgress(r){const wrapper=document.querySelector('#manualLearning'),bar=document.querySelector('#progress'),text=document.querySelector('#learningProgressText');const manual=r&&r.kind==='train'&&r.id===manualLearningRunId;wrapper.hidden=!(manual&&['running','finalizing','stopping'].includes(r.state));if(wrapper.hidden)return;if(!r.plan_ready){text.textContent='正在核对新增图片…';bar.hidden=false;bar.removeAttribute('value');return;}const plan=r.input_plan||{},added=plan.new||{total:0,completed:0,failed:0},changed=plan.changed||{total:0,completed:0},reuse=plan.reuse||{total:0};text.textContent=`本次新增图片 ${added.completed}/${added.total}`+(added.failed?` · 待重试 ${added.failed}`:'')+(changed.total?` · 修改图片 ${changed.completed}/${changed.total}`:'')+` · 已有样本复用 ${reuse.total}`;if(!added.total)text.textContent='本次无新增图片'+(changed.total?` · 修改图片 ${changed.completed}/${changed.total}`:'')+'，正在应用最新标签';bar.hidden=!added.total;bar.max=Math.max(added.total,1);bar.value=added.completed;}
// 状态轮询只更新展示和按钮，不启动学习，也不把历史训练总数显示为新增进度。
async function refreshAI(){try{const data=await api('/ai/status');latestRun=data.run;const r=data.run,training=data.training||(r?.kind==='train'?r:null),screening=data.screening||(r?.kind==='screen'?r:null),queued=data.review_learning||{};const trainingActive=training&&['running','stopping','finalizing'].includes(training.state);const screeningActive=screening&&['running','stopping','paused_for_learning'].includes(screening.state);const running=r&&['running','stopping','finalizing','paused_for_learning'].includes(r.state);const active=running||queued.pending||queued.running;document.querySelector('#reviewLearning').textContent=queued.pending||queued.running?`后台复核学习：等待 ${queued.pending||0} 条 · 处理中 ${queued.running||0} 条（筛查独立运行）`:'';document.querySelector('#train').disabled=aiBusy||trainingActive;document.querySelector('#screen').disabled=aiBusy||screeningActive;document.querySelector('#stopTrain').disabled=aiBusy||!(trainingActive||queued.pending||queued.running)||training?.state==='stopping';document.querySelector('#stop').disabled=aiBusy||!screeningActive||screening?.state==='stopping';const states={running:'进行中',paused_for_learning:'复核模型更新后继续筛选',stopping:'正在停止',stopped:'已停止',finalizing:'正在更新个人分类器',completed:'已完成',failed:'需要处理',needs_samples:'需要有效的喜欢和不喜欢样本'};const manual=r&&r.id===manualLearningRunId;document.querySelector('#taskSummary').hidden=!active&&!manual;document.querySelector('#aiPhase').textContent=r?states[r.state]||r.state:'';document.querySelector('#aiProgress').textContent=!r?'':r.kind==='screen'?`当前筛选 ${r.processed+r.failed}/${r.total}`:manual?(r.state==='completed'?`本次新增图片学习完成 ${(r.input_plan?.new?.completed)||0} 张`:'手动学习'):running?'正在根据人工复核更新喜好模型':'';renderLearningProgress(training);const warnings=r?.warnings||[];document.querySelector('#warningDetails').hidden=!warnings.length;document.querySelector('#warningList').textContent=warnings.map(item=>`${item.name||item.image_id}：${item.error}`).join('\n');document.querySelector('#aiError').textContent=r&&r.error?r.error:r&&r.kind==='screen'&&r.state==='running'&&r.processed+r.failed===r.total?'当前队列已处理完，持续等待新图片。':'';}catch(error){document.querySelector('#aiError').textContent='状态读取失败：'+error.message;}}
// 仅手动点击学习才关联本轮新增进度，刷新页面不会恢复旧进度条。
async function startAI(kind){if(aiBusy)return;aiBusy=true;document.querySelector('#train').disabled=document.querySelector('#screen').disabled=true;if(kind==='train'){document.querySelector('#manualLearning').hidden=false;document.querySelector('#learningProgressText').textContent='正在检查当前目录…';const bar=document.querySelector('#progress');bar.hidden=false;bar.removeAttribute('value');}try{const result=await api('/ai/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind})});if(kind==='train')manualLearningRunId=result.id;message.textContent=kind==='train'?'开始检查新增图片，已有特征将复用':'筛选已启动，结果进入AI待复核目录';}catch(error){document.querySelector('#manualLearning').hidden=true;message.textContent=error.message;}finally{aiBusy=false;await refreshAI();}}
// 分别停止学习或筛查，停止学习不会中断筛查，当前图片可完成。
async function stopAI(kind){try{await api('/ai/stop?kind='+kind,{method:'POST'});await refreshAI();}catch(error){message.textContent=error.message;}}
// 切换初选和两类AI复核来源，等待当前选择完成后再换图。
async function changeSource(value){if(busy&&current)return;source=value;document.querySelectorAll('[data-source]').forEach(button=>button.classList.toggle('active',button.dataset.source===value));try{await nextImage();}catch(error){message.textContent=error.message;}}
// 手工刷新目录和当前图片，不自动启动学习或筛选。
async function rescan(){if(busy&&current)return;try{await api('/scan',{method:'POST'});await refreshCounts();await nextImage();}catch(error){message.textContent=error.message;}}
// 串行轮询任务与数量，避免慢请求堆积；空来源有新图片时自动补充。
async function poll(){await refreshAI();try{await refreshCounts();if(!current&&!busy)await nextImage();}catch(error){document.querySelector('#aiError').textContent=error.message;}setTimeout(poll,2000);}
document.querySelector('#train').addEventListener('click',()=>startAI('train'));document.querySelector('#screen').addEventListener('click',()=>startAI('screen'));document.querySelector('#stop').addEventListener('click',()=>stopAI('screen'));document.querySelector('#stopTrain').addEventListener('click',()=>stopAI('train'));document.querySelector('#rescan').addEventListener('click',rescan);document.querySelectorAll('[data-source]').forEach(button=>button.addEventListener('click',()=>changeSource(button.dataset.source)));poll();pollModel();
yes.addEventListener('click' ,()=>decide('like'));no.addEventListener('click',()=>decide('notlike'));initialize();
</script></body></html>
